<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>StudyMind — AI Teaching Assistant</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #0f1117; color: #fff; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    h1 { font-size: 2rem; color: #4f8ef7; margin-bottom: 8px; }
    p.sub { color: #888; margin-bottom: 32px; font-size: 0.95rem; }
    .container { width: 100%; max-width: 700px; padding: 0 16px; }
    .upload-box { background: #1e2130; border: 2px dashed #4f8ef7; border-radius: 12px; padding: 24px; text-align: center; margin-bottom: 24px; }
    .upload-box input { display: none; }
    .upload-box label { cursor: pointer; background: #4f8ef7; color: white; padding: 10px 24px; border-radius: 8px; font-size: 0.95rem; }
    .upload-box p { margin-top: 12px; color: #888; font-size: 0.85rem; }
    #upload-status { margin-top: 10px; font-size: 0.9rem; color: #4f8ef7; }
    .chat-box { background: #1e2130; border-radius: 12px; padding: 20px; height: 320px; overflow-y: auto; margin-bottom: 16px; display: flex; flex-direction: column; gap: 12px; }
    .msg { padding: 10px 14px; border-radius: 8px; max-width: 85%; font-size: 0.9rem; line-height: 1.5; }
    .msg.user { background: #4f8ef7; align-self: flex-end; }
    .msg.bot { background: #2a2d3e; align-self: flex-start; }
    .input-row { display: flex; gap: 10px; }
    .input-row input { flex: 1; padding: 12px 16px; border-radius: 8px; border: none; background: #1e2130; color: white; font-size: 0.95rem; outline: none; }
    .input-row button { padding: 12px 20px; background: #4f8ef7; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 0.95rem; }
    .input-row button:hover { background: #3a7be0; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📚 StudyMind</h1>
    <p class="sub">Upload your notes and ask anything</p>

    <div class="upload-box">
      <input type="file" id="pdf-input" accept=".pdf" />
      <label for="pdf-input">📄 Upload PDF</label>
      <p id="upload-status">No file uploaded yet</p>
    </div>

    <div class="chat-box" id="chat-box">
      <div class="msg bot">Hi! Upload your notes and ask me anything about them.</div>
    </div>

    <div class="input-row">
      <input type="text" id="question-input" placeholder="Ask a question about your notes..." />
      <button onclick="askQuestion()">Ask</button>
    </div>
  </div>

  <script>
    // Upload PDF
    document.getElementById('pdf-input').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      document.getElementById('upload-status').textContent = 'Uploading...';
      const formData = new FormData();
      formData.append('file', file);
      const res = await fetch('http://127.0.0.1:8000/upload', { method: 'POST', body: formData });
      const data = await res.json();
      document.getElementById('upload-status').textContent = data.message;
    });

    // Ask question
    async function askQuestion() {
      const input = document.getElementById('question-input');
      const question = input.value.trim();
      if (!question) return;
      addMessage(question, 'user');
      input.value = '';
      addMessage('Thinking...', 'bot');
      const res = await fetch('http://127.0.0.1:8000/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question })
      });
      const data = await res.json();
      const chat = document.getElementById('chat-box');
      chat.lastChild.remove();
      addMessage(data.answer, 'bot');
    }

    function addMessage(text, type) {
      const chat = document.getElementById('chat-box');
      const msg = document.createElement('div');
      msg.className = `msg ${type}`;
      msg.textContent = text;
      chat.appendChild(msg);
      chat.scrollTop = chat.scrollHeight;
    }

    // Allow Enter key
    document.getElementById('question-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') askQuestion();
    });
  </script>
</body>
</html>
